<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>ForgePilot Agent</title>
</head>
<body>
  <div id="top-bar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 12 12 17 22 12"></polyline>
        <polyline points="2 17 12 22 22 17"></polyline>
      </svg>
      <span class="brand-name">ForgePilot</span>
      <span id="status-dot" class="status-dot connected" title="Connected to TrueForge"></span>
    </div>

    <div class="model-picker-container">
      <select id="model-select" title="Active Model in TrueForge">
        <option value="nvidia/nemotron-3-ultra-550b-a55b">nvidia/nemotron-3-ultra-550b-a55b</option>
        <option value="google-gemini/gemini-3-8-flash">google-gemini/gemini-3-8-flash</option>
      </select>
      <button id="refresh-models-btn" class="icon-btn" title="Refresh models from TrueForge">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
      <button id="reset-session-btn" class="icon-btn" title="Reset session (new chat)">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </div>

  <div id="sub-bar">
    <div id="budget-container">
      <span class="budget-label">Context:</span>
      <span id="budget-value">0 / 30k tokens</span>
      <div id="budget-progress-track">
        <div id="budget-progress-fill" style="width: 0%;"></div>
      </div>
    </div>
    <span id="session-label" class="session-label">Fresh Session</span>
  </div>

  <div id="welcome-state">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <polyline points="7 10 10 12.5 7 15"></polyline>
        <line x1="12.5" y1="15" x2="16.5" y2="15"></line>
      </svg>
    </div>
    <h1 class="welcome-title">ForgePilot</h1>
    <p class="welcome-subtitle">TrueForge local mode &middot; MCP tools ready &middot; Zero silent writes.</p>

    <div class="suggestions">
      <button class="suggestion" data-prompt="Explain or refactor the code I currently have selected in the editor.">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span>Explain or refactor selected code</span>
        <svg class="suggestion-chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <button class="suggestion" data-prompt="Find where a symbol is defined and used across this repository.">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <span>Find where a symbol is defined and used</span>
        <svg class="suggestion-chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <button class="suggestion" data-prompt="Plan a safe multi-file change before editing. Show me the context you would choose and why.">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>Plan a safe multi-file change</span>
        <svg class="suggestion-chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <p class="welcome-hint"><kbd>Ctrl+K Ctrl+I</kbd> Inline Edit &nbsp;&middot;&nbsp; <kbd>@file</kbd> / <kbd>@symbol</kbd> &nbsp;&middot;&nbsp; <kbd>Ctrl+Enter</kbd> to Send</p>
  </div>

  <div id="chat-log" style="display: none;"></div>

  <div id="input-container">
    <div class="composer-card">
      <div class="attach-chips" id="attach-chips"></div>
      <textarea id="prompt-input" placeholder="Ask ForgePilot... Type @ for files or symbols"></textarea>
      <div class="composer-footer">
        <button id="chip-file" class="composer-icon" title="Attach @file (path)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
        </button>
        <button id="chip-symbol" class="composer-icon" title="Attach @symbol (name)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>
        <span class="flex-spacer"></span>
        <button id="cancel-btn" class="stop-btn" style="display: none;">
          <span class="stop-square"></span> Stop
        </button>
        <button id="send-btn" class="send-btn">
          <span>Send</span>
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="webview.js"></script>
</body>
</html>
